version: "3.9"

services:
  devopsdb:
    image: jagadeeshasapu/facebook:db
    ports:
      - "3306:3306"
    deploy:
      replicas: 2
    networks:
      - mynetwork

  application:
    image: jagadeeshasapu/facebook:java
    ports:
      - "1111:8080"
    deploy:
      replicas: 2
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay
